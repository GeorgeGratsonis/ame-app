    <style>
      html, body { background-color: #DDD4C5; overscroll-behavior: none; }
      body { margin: 0; -webkit-tap-highlight-color: transparent; }

      /* The boot layer. Painted by the browser before a single line of app code
         runs, which is the whole point: the JS bundle is megabytes and until it
         parses, React cannot draw anything at all. Without this the app opens on
         a white page for several seconds, which is exactly what a home-screen
         icon must never do. */
      #ame-boot {
        position: fixed; inset: 0; z-index: 2147483647;
        background: #DDD4C5;
        display: flex; align-items: center; justify-content: center;
        opacity: 1; transition: opacity 420ms ease-out;
      }
      #ame-boot.ame-boot-out { opacity: 0; pointer-events: none; }
      /* The opening: the name writes itself. A sand cover slides off the
         wordmark (translate-only — the mark itself never moves or scales,
         the owner's rule), then a hair-thin line below breathes in opacity
         while the bundle keeps loading. All compositor work. */
      .ame-mark { position: relative; overflow: hidden; }
      .ame-mark img { display: block; width: 200px; height: auto; }
      .ame-cover {
        position: absolute; top: -4px; bottom: -4px; left: -6px;
        width: calc(100% + 12px); background: #DDD4C5;
        animation: ame-write 950ms cubic-bezier(.65,0,.35,1) 150ms forwards;
      }
      @keyframes ame-write { to { transform: translateX(calc(100% + 12px)); } }
      .ame-wait {
        margin: 28px auto 0; width: 36px; height: 1px; background: #311D10;
        opacity: 0; animation: ame-waitpulse 2.6s ease-in-out 1.6s infinite;
      }
      @keyframes ame-waitpulse { 0%,100% { opacity: 0 } 50% { opacity: .35 } }
      @media (prefers-reduced-motion: reduce) {
        .ame-cover { animation: none; opacity: 0; }
        .ame-wait { animation: none; }
        .ame-mark img { animation: ame-fadein .4s ease-out both; }
        @keyframes ame-fadein { from { opacity: 0 } to { opacity: 1 } }
      }
    </style>

    <script>
      // The app calls this when it has fonts and its first data, so the seam is
      // invisible: the React splash is already painted underneath before this
      // layer fades. The timeout is a failsafe — a boot screen that can wedge
      // forever is worse than one that reveals a half-ready app.
      (function () {
        var el = document.getElementById('ame-boot');
        var gone = false;
        function dismiss() {
          if (gone || !el) return;
          gone = true;
          el.className = 'ame-boot-out';
          setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 500);
        }
        window.__ameBootDismiss = dismiss;
        setTimeout(dismiss, 12000);
      })();
    </script>
